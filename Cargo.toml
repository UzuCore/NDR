[package]
name = "ndir"
version = "2.0.0"
edition = "2024"
description = "NDIR native Rust dual-pane file manager"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
encoding_rs = "0.8"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
crc32fast = "1"
base64 = "0.22"
filetime = "0.2"
chrono = "0.4"
raw-window-handle = "0.6"
quick-xml = "0.41"
png = "=0.18.1"
suppaftp = { version = "6", features = ["native-tls"] }
log = "0.4"
ssh2 = { version = "0.9", features = ["openssl-on-win32", "vendored-openssl"] }
native-tls = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_System_Diagnostics_Debug", "Win32_System_Environment", "Win32_System_Ioctl", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Registry", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_NetworkManagement_WNet", "Win32_Security", "Win32_Networking_WinHttp", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_Media_Audio"] }
windows-core = "=0.61.2"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Graphics_Gdi"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

