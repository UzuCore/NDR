name: Windows build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish GitHub Release after successful build
        type: boolean
        default: false

# GitHub Releases use the built-in GITHUB_TOKEN; no personal token or secret is needed.
permissions:
  contents: write

jobs:
  build:
    name: Test, package and publish Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      NDR_RESOURCE_DIR: ${{ github.workspace }}\Resources
    steps:
      - name: Check out complete source and runtime resources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install stable Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2

      - name: Prepare OpenSSL build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $perlDir = 'C:\Strawberry\perl\bin'
          if (-not (Test-Path (Join-Path $perlDir 'perl.exe'))) {
            choco install strawberryperl --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Unable to install Strawberry Perl' }
          }
          if (-not (Test-Path (Join-Path $perlDir 'perl.exe'))) {
            throw 'Strawberry Perl executable not found'
          }
          $perlDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Perl available: $perlDir"

      - name: Validate checked-in resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'Resources/Languages/ko.lang',
            'Resources/Languages/en.lang',
            'Resources/Skins/black/conf.ini',
            'Resources/Skins/classic/conf.ini',
            'Resources/Colors/black.col',
            'Resources/Tools/7zip/7za.exe',
            'Resources/Tools/7zip/Full/7z.exe',
            'Resources/Tools/7zip/Full/7z.dll',
            'Resources/Tools/7zip/License.txt',
            'Resources/complete.wav',
            'THIRD-PARTY-NOTICES.txt',
            'docs/original-menus.txt',
            'scripts/package-ci.ps1'
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing runtime dependency in Git checkout: $file"
            }
          }
          Write-Host "Validated $($required.Count) required bundled resource files"

      - name: Test NDR library, UI and native components
        run: cargo test --release --locked

      - name: Build optimized Windows x64 NDR.exe
        shell: pwsh
        run: |
          # A restored Cargo cache may contain an old executable. Re-link it
          # from the current commit before packaging the public release.
          Remove-Item target/release/ndr.exe -Force -ErrorAction SilentlyContinue
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Optimized NDR build failed' }

      - name: Assemble complete package and verify ZIP integrity
        shell: pwsh
        run: ./scripts/package-ci.ps1 -OutputDir target/ci-release

      - name: Upload workflow build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NDR-windows-x64-build-${{ github.run_number }}
          path: |
            target/ci-release/NDR-windows-x64.zip
            target/ci-release/NDR.exe
            target/ci-release/SHA256SUMS.txt
            target/ci-release/build-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Automatically create or update GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "build-$env:GITHUB_RUN_NUMBER"
          $out = 'target/ci-release'
          $assets = @(
            "$out/NDR-windows-x64.zip",
            "$out/NDR.exe",
            "$out/SHA256SUMS.txt",
            "$out/build-manifest.json"
          )
          $tags = @(gh release list --repo $env:GITHUB_REPOSITORY --json tagName --limit 100 --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release listing failed' }
          if ($tags -contains $tag) {
            gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to update existing release $tag" }
          } else {
            gh release create $tag @assets `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "NDR Windows x64 - $tag" `
              --notes-file "$out/RELEASE-NOTES.md" `
              --latest
            if ($LASTEXITCODE -ne 0) { throw "Failed to publish release $tag" }
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json url --jq .url
          if ($LASTEXITCODE -ne 0) { throw 'Published release could not be verified' }
